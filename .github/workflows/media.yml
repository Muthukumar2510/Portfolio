name: Media

# Whenever photos are pushed, strip metadata (GPS, camera, time), fix rotation, cap size,
# refresh blur placeholders in public/media/manifest.json, and commit the result back.
# Commits made with GITHUB_TOKEN don't retrigger workflows, so this can't loop.

on:
  push:
    paths:
      - 'public/media/**'
      - '!public/media/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run media
      - name: Commit optimised media
        run: |
          if git diff --quiet -- public/media; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git add public/media
          git commit -m "Optimise media: strip metadata, resize, update manifest"
          git push
